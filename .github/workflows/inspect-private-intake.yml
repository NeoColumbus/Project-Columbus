name: Inspect Private Intake
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      cleanup_test:
        description: Remove only the verified synthetic deployment check
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: private-intake-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/inspect-private-intake.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIELD_REVIEW_TOKEN: ${{ secrets.FIELD_REVIEW_TOKEN }}
          CLEANUP_TEST: ${{ inputs.cleanup_test }}
          GH_OPERATIONS_TOKEN: ${{ github.token }}
