name: Public launch checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:field-api
      - run: pnpm test:proof
      - run: pnpm build:pages
      - run: pnpm test:launch
        env:
          PUBLIC_ROOT: dist/pages
      - run: pnpm field-api:dry-run
